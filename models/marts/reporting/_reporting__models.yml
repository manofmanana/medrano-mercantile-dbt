version: 2

models:
  - name: rpt_kpis
    description: Single row of headline KPIs for the dashboard's number tiles.
    data_tests:
      - row_count_is:
          arguments:
            expected: 1
    columns:
      - name: total_revenue
        description: Lifetime gross sales.
      - name: total_profit
        description: Lifetime net profit.
      - name: profit_margin
        description: Total profit ÷ total revenue.
      - name: avg_days_to_sell
        description: Average days from listed to sold.
      - name: revenue_30d
        description: Sales in the last 30 days.
      - name: revenue_prev_30d
        description: Sales in the 30 days before that.
      - name: revenue_30d_change_pct
        description: Change from the prior 30 days to the last 30.
      - name: open_items
        description: Items not yet sold.
      - name: open_inventory_value
        description: Sum of asking prices for unsold items.
      - name: stale_items
        description: Unsold items on hand longer than the stale threshold.
      - name: sell_through_rate
        description: Items sold ÷ all items taken in.
      - name: refreshed_at
        description: When dbt last rebuilt this table.

  - name: rpt_sales_monthly
    description: One row per calendar month (zero-filled), with running totals and month-over-month change.
    columns:
      - name: month_start
        description: First day of the month.
        data_tests: [unique, not_null]
      - name: items_received
        description: Items taken in that month.
      - name: items_sold
        description: Items sold that month.
      - name: revenue
        description: Gross sales.
      - name: net_profit
        description: Net profit.
      - name: cumulative_revenue
        description: Running total of revenue.
      - name: cumulative_profit
        description: Running total of net profit.
      - name: revenue_mom_change_pct
        description: Revenue change vs the previous month.

  - name: rpt_category_performance
    description: One row per category — sales, open stock, margin and sell-through.
    columns:
      - name: category
        description: Product category.
        data_tests: [unique, not_null]
      - name: sell_through_rate
        description: Share of the category's items that have sold.
        data_tests:
          - between:
              arguments:
                min_value: 0
                max_value: 1

  - name: rpt_platform_performance
    description: One row per sales platform.
    columns:
      - name: platform
        description: Sales platform (`Unknown` when not recorded).
        data_tests: [unique, not_null]

  - name: rpt_consignor_payouts
    description: One row per consignor — items placed, sold, and payout owed.
    columns:
      - name: consignor
        description: Consignor name.
        data_tests: [unique, not_null]
      - name: payout_owed
        description: Lifetime amount owed to the consignor for sold items.
        data_tests: [non_negative]

  - name: rpt_hours_monthly
    description: >
      One row per month with hours worked, revenue, net profit and profit per
      hour. `hours_basis` shows whether the month's hours are logged,
      estimated or a mix.
    columns:
      - name: month_start
        description: First day of the month.
        data_tests: [unique, not_null]
      - name: logged_hours
        description: Hours entered in the labor log.
        data_tests: [non_negative]
      - name: estimated_hours
        description: Rule-of-thumb hours for work done before logging began.
        data_tests: [non_negative]
      - name: total_hours
        description: Logged plus estimated hours.
      - name: profit_per_hour
        description: Net profit ÷ total hours; null when no hours.
      - name: hours_basis
        description: "`logged`, `estimated`, `mixed` or `none`."
        data_tests:
          - accepted_values:
              arguments:
                values: ["logged", "estimated", "mixed", "none"]

  - name: rpt_haul_performance
    description: >
      One row per haul (sourcing event): items in, items sold, revenue, profit,
      open stock, hours and profit per hour. Items without a haul roll up to
      `(no haul)`.
    columns:
      - name: haul
        description: Haul name.
        data_tests: [unique, not_null]
      - name: sell_through_rate
        description: Share of the haul's items that have sold.
        data_tests:
          - between:
              arguments:
                min_value: 0
                max_value: 1
      - name: total_hours
        description: Logged plus estimated hours charged to the haul.
        data_tests: [non_negative]
      - name: profit_per_hour
        description: Net profit ÷ total hours.

  - name: rpt_reprice_suggestions
    description: >
      One row per listed item with this week's pricing action: `Clear out`
      after `clear_out_after_days` on hand, `Bundle` under
      `bundle_below_price`, `Drop price` after `reprice_after_days_at_price`
      days at one price (suggested price rounded down to $5), otherwise `Hold`.
      Price history comes from the `snap_items` snapshot.
    columns:
      - name: sku
        description: Business key.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_inventory')
                field: sku
      - name: action
        description: What to do this week.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Clear out", "Drop price", "Bundle", "Hold"]
      - name: action_order
        description: Sort key for `action`, most urgent first.
      - name: suggested_price
        description: New asking price for `Drop price`; null otherwise.
        data_tests: [non_negative]
      - name: price_since
        description: Date the current asking price was set.
      - name: days_at_price
        description: Days at the current asking price.
      - name: reason
        description: One-line explanation shown in the weekly email.
