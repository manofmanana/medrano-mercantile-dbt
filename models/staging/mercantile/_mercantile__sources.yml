version: 2

sources:
  - name: mercantile
    description: >
      Operational inventory ledger for Medrano Mercantile, stored in the
      `mercantile` Postgres database (container `mercantile-pg` on CT 111).
      One row per physical item, updated in place as it moves through
      Received → Listed → Sold.
    schema: public
    tables:
      - name: items
        description: Every item the business has taken in, owned or consigned.
        config:
          loaded_at_field: "nullif(updated_at::text, '')::timestamptz"
          freshness:
            warn_after: {count: 30, period: day}
        columns:
          - name: sku
            description: "Business key, formatted `YYMMDD-NNN` (date received + sequence)."
            data_tests: [unique, not_null]
          - name: status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["Received", "Listed", "Sold"]
          - name: owner_split
            description: Consignor's share of the sale price (0–1). Null for owned inventory.
          - name: haul
            description: >
              Name of the sourcing event the item came from (for example
              "Din Tai Fung office haul"). Free text; null when not tagged.
          - name: buyer
            description: Who bought the item, when recorded. Kept private.
          - name: date_received
            description: Date received. A `date` since the 2026-11 migration (text before).
          - name: date_listed
            description: Date first listed. A `date` since the 2026-11 migration (text before).
          - name: date_sold
            description: Date sold. A `date` since the 2026-11 migration (text before).
          - name: updated_at
            description: Last edit time. A `timestamptz` since the 2026-11 migration (text before).

      - name: labor_log
        description: >
          Hours worked on the business, logged with the Metabase "Log hours"
          action. Optional haul tag so hours can be charged to a sourcing event.
        columns:
          - name: entry_id
            data_tests: [unique, not_null]
          - name: work_date
            data_tests: [not_null]
          - name: hours
            data_tests:
              - not_null
              - between:
                  arguments:
                    min_value: 0
                    max_value: 24
