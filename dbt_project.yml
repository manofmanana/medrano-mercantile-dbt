name: medrano
version: "1.0.0"
profile: medrano

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Items older than this many days without selling count as "stale" inventory.
  stale_inventory_days: 60

models:
  medrano:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      reporting:
        +tags: ["metabase"]

data_tests:
  medrano:
    +severity: error
